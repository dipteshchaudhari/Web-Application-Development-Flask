<html>
    <head>
        <title> Post method understanding</title>
    </head>
    <body>
        <!-- action and method defining is important steps here  -->
        <form action="/submit", method="post" >  
             
            <label>Name:</label>
            <input type="text", name="name">

            <br><br>

            <label>Email:</label>
            <input type="email", name="email">

            <br><br>

            <button type="submit">submit</button>
        </form>
    </body>
</html>
